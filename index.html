<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Официальный словарь Нуринамского языка</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --accent-hover: #1f6feb;
            --text-main: #c9d1d9;
            --text-bright: #ffffff;
            --text-muted: #8b949e;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: var(--text-bright);
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.05rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text-bright);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .alphabet-section {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .alphabet-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .alphabet-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .letter-btn {
            background: #21262d;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .letter-btn:hover {
            background: #30363d;
            color: var(--text-bright);
        }

        .letter-btn.active {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .letter-btn.reset-btn {
            background: #30363d;
            color: var(--text-bright);
            margin-right: 6px;
        }

        .status-bar {
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dictionary-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .word-card {
            background-color: var(--card-bg);
            padding: 16px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.2s;
        }

        .word-card:hover {
            border-color: #484f58;
        }

        .word-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .word-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent);
        }

        .word-translation {
            color: var(--text-bright);
            font-size: 1.05rem;
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 48px 20px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Официальный словарь Нуринамского языка</h1>
        <p class="subtitle">Полный указатель букв и онлайн-поиск по словам и переводу</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск (введите слово на нуринамском или русском)...">
    </div>

    <div class="alphabet-section">
        <div class="alphabet-title">Нажмите на букву для фильтрации:</div>
        <div class="alphabet-bar" id="alphabetBar">
            <button class="letter-btn reset-btn" onclick="resetFilter()">Все слова</button>
        </div>
    </div>

    <div class="status-bar" id="statusBar">
        <span>Показаны все слова</span>
    </div>

    <div class="dictionary-list" id="dictionaryList"></div>
</div>

<script>
    // Полный алфавит нуринамского языка
    const alphabet = [
        "А", "Ӑ", "Ꙗ", "Ћ", "V", "Г", "Ґ", "Ѓ", "Д", "Ԭ", 
        "Ѥ", "Ѥ̆", "Ĭ", "Э", "Э̆", "З", "Ҙ", "Ж", "Җ", "Ӝ", 
        "И", "Й", "J", "К", "Ҡ", "Q", "Ќ", "Л", "Љ", "М", 
        "Н", "Ҥ", "Њ", "Ӈ", "О", "Ŏ", "Ю", "П", "Р", "Ṕ", 
        "С", "Б", "Т", "Ҭ", "У", "Ў", "Ӯ", "Ф", "Х", "Ӿ", 
        "Џ", "Ц", "Ҵ", "Ч", "Ҷ", "Ꚇ", "Ш", "Ш̆", "Щ", "Щ̆", 
        "Ъ", "Ы", "Ꙑ", "Ы̆", "Ӹ", "Ь", "Ѣ", "Ъ̀", "Ԃ", "Һ", "Ԧ"
    ];

    // База данных слов нуринамского языка
    // Пополняйте этот список своими словами!
    const dictionary = [
        { word: "Аҙа", translation: "улица" },
        { word: "Арам", translation: "приветствие, мир" },
        { word: "Ӑн", translation: "день, светлое время" },
        { word: "Ꙗра", translation: "земля, территория" },
        { word: "Ћор", translation: "город, столица" },
        { word: "Vита", translation: "жизнь, энергия" },
        { word: "Гал", translation: "река, вода" },
        { word: "Ґури", translation: "ветер" },
        { word: "Дон", translation: "дом, здание" },
        { word: "Ԭимар", translation: "утренний свет" },
        { word: "Эн", translation: "человек" },
        { word: "Зур", translation: "гора" },
        { word: "Ҙор", translation: "улица, проспект" },
        { word: "Jор", translation: "закон, правило" },
        { word: "Qис", translation: "ночь, темнота" },
        { word: "Ш̆ум", translation: "шелест ветра" }
    ];

    let activeLetter = null;

    // Генерируем кнопки алфавита
    const alphabetBar = document.getElementById('alphabetBar');
    alphabet.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.textContent = letter;
        btn.onclick = () => filterByLetter(letter, btn);
        alphabetBar.appendChild(btn);
    });

    // Функция отображения карточек со словами
    function renderDictionary(data) {
        const list = document.getElementById('dictionaryList');
        const statusBar = document.getElementById('statusBar');
        list.innerHTML = '';

        statusBar.textContent = `Найдено слов: ${data.length}`;

        if (data.length === 0) {
            list.innerHTML = '<div class="no-results">По вашему запросу ничего не найдено</div>';
            return;
        }

        // Сортировка по нуринамскому слову
        data.sort((a, b) => a.word.localeCompare(b.word));

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.innerHTML = `
                <div class="word-header">
                    <span class="word-title">${item.word}</span>
                </div>
                <div class="word-translation">— ${item.translation}</div>
            `;
            list.appendChild(card);
        });
    }

    // Двуязычный поиск по поисковой строке
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        
        if (query) {
            clearActiveButtons();
            activeLetter = null;
        }

        const filtered = dictionary.filter(item => 
            item.word.toLowerCase().includes(query) || 
            item.translation.toLowerCase().includes(query)
        );
        
        renderDictionary(filtered);
    });

    // Поиск / Фильтр по первой букве
    function filterByLetter(letter, buttonElement) {
        document.getElementById('searchInput').value = '';
        clearActiveButtons();

        if (activeLetter === letter) {
            activeLetter = null;
            renderDictionary(dictionary);
        } else {
            activeLetter = letter;
            buttonElement.classList.add('active');
            
            const filtered = dictionary.filter(item => 
                item.word.startsWith(letter) || 
                item.word.toUpperCase().startsWith(letter)
            );
            
            renderDictionary(filtered);
        }
    }

    function clearActiveButtons() {
        document.querySelectorAll('.letter-btn').forEach(btn => {
            if (!btn.classList.contains('reset-btn')) {
                btn.classList.remove('active');
            }
        });
    }

    function resetFilter() {
        document.getElementById('searchInput').value = '';
        clearActiveButtons();
        activeLetter = null;
        renderDictionary(dictionary);
    }

    // Первоначальный вывод всех слов
    renderDictionary(dictionary);
</script>

</body>
</html>
