<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Официальный словарь Нуринамского языка</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --accent-hover: #1f6feb;
            --text-main: #c9d1d9;
            --text-bright: #ffffff;
            --text-muted: #8b949e;
            --border: #30363d;
            --tag-bg: #21262d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: var(--text-bright);
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.05rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text-bright);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .alphabet-section {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .alphabet-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .alphabet-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .letter-btn {
            background: #21262d;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .letter-btn:hover {
            background: #30363d;
            color: var(--text-bright);
        }

        .letter-btn.active {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .letter-btn.reset-btn {
            background: #30363d;
            color: var(--text-bright);
            margin-right: 6px;
        }

        .status-bar {
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .dictionary-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .word-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .word-card:hover {
            border-color: #484f58;
        }

        .word-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .word-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent);
        }

        .word-translation {
            color: var(--text-bright);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .word-description {
            color: var(--text-main);
            font-size: 0.98rem;
            line-height: 1.5;
        }

        .word-forms {
            background: var(--tag-bg);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px dotted var(--border);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .word-forms strong {
            color: var(--text-main);
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 48px 20px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Официальный словарь Нуринамского языка</h1>
        <p class="subtitle">Полная справочная система, формы слов и алфавитный поиск</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по словам, переводу или описанию...">
    </div>

    <div class="alphabet-section">
        <div class="alphabet-title">Фильтр по первой букве:</div>
        <div class="alphabet-bar" id="alphabetBar">
            <button class="letter-btn reset-btn" onclick="resetFilter()">Все слова</button>
        </div>
    </div>

    <div class="status-bar" id="statusBar">
        <span>Показаны все слова</span>
    </div>

    <div class="dictionary-list" id="dictionaryList"></div>
</div>

<script>
    // Алфавит
    const alphabet = [
        "А", "Ӑ", "Ꙗ", "Ћ", "V", "Г", "Ґ", "Ѓ", "Д", "Ԭ", 
        "Ѥ", "Ѥ̆", "Ĭ", "Э", "Э̆", "З", "Ҙ", "Ж", "Җ", "Ӝ", 
        "И", "Й", "J", "К", "Ҡ", "Q", "Ќ", "Л", "Љ", "М", 
        "Н", "Ҥ", "Њ", "Ӈ", "О", "Ŏ", "Ю", "П", "Р", "Ṕ", 
        "С", "Б", "Т", "Ҭ", "У", "Ў", "Ӯ", "Ф", "Х", "Ӿ", 
        "Џ", "Ц", "Ҵ", "Ч", "Ҷ", "Ꚇ", "Ш", "Ш̆", "Щ", "Щ̆", 
        "Ъ", "Ы", "Ꙑ", "Ы̆", "Ӹ", "Ь", "Ѣ", "Ъ̀", "Ԃ", "Һ", "Ԧ"
    ];

    // База данных слов с описанием и формами изменения
    const dictionary = [
        { 
            word: "А", 
            translation: "Вы",
            description: "«Вы» — это местоимение второго лица во множественном числе, которое используется в русском языке для обращения к нескольким людям или в контексте вежливого обращения к одному человеку. В последнем случае, использование «Вы» с прописной буквы подчеркивает уважение и вежливость по отношению к собеседнику.",
            forms: "мн.ч.: А | род.падеж: Ас | дат.падеж: Ам | вин.падеж: Ас | твор.падеж: Ами | пред.падеж: Ас. Другие формы: | Аш - Ваш | Ашэ - Вашэ"
        },
        { 
            word: "А", 
            translation: "А",
            description: "Союз «а» в русском языке используется для соединения двух частей сложносочиненного предложения, где первая часть утверждает или сообщает что-то, а вторая часть, вводимая союзом «а», часто подчеркивает противопоставление или добавляет дополнительную информацию, которая контрастирует с предыдущей.",
            forms: "не изменяется"
        },
        { 
            word: "Аvгост", 
            translation: "Август",
            description: "Август — это восьмой месяц года в григорианском календаре. Он состоит из 31 дня. Название месяца происходит от латинского «Augustus», которое было дано в честь римского императора Октавиана Августа. В разных культурах и традициях август может иметь свои особенности и значения.",
            forms: "мн.ч.: Аvгост | род.падеж: Аvгоста | дат.падеж: Аvгосту | вин.падеж: Аvгост | твор.падеж: Аvгостом | пред.падеж: Аvгостѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "Аҙа", 
            translation: "Улица",
            description: "Улица — это элемент городской или сельской инфраструктуры, предназначенный для движения транспортных средств и пешеходов. Улицы обычно имеют определенные границы, обозначенные зданиями или другими сооружениями с обеих сторон.",
            forms: "мн.ч.: Аҙа | род.падеж: Аҙы | дат.падеж: Аҙѥ | вин.падеж: Аҙу | твор.падеж: Аҙоj | пред.падеж: Аҙѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "Ajдин", 
            translation: "Комната",
            description: "Комната — это закрытое помещение внутри здания, предназначенное для разных целей, таких как жилье, работа, хранение вещей и отдых. Комнаты могут различаться по размеру, функциям, оформлению и расположению.",
            forms: "мн.ч.: Аjдины | род.падеж: Аjдины | дат.падеж: Аjдињѥ | вин.падеж: Аjдину | твор.падеж: Аjдиноj | пред.падеж: Аjдињѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "Аjсзип", 
            translation: "Девушка",
            description: "«Девушка» — это термин, который обычно используется для обозначения молодой женщины или девушки, особенно в подростковом и молодом возрасте, примерно от 12 до 25 лет. В зависимости от контекста, значение этого слова может варьироваться.",
            forms: "мн.ч.: Аjсзипы | род.падеж: Аjсзипы | дат.падеж: Аjсзипѥ | вин.падеж: Аjсзипу | твор.падеж: Аjсзипоj | пред.падеж: Аjсзипѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "Акауӈ", 
            translation: "Аккаунт",
            description: "Аккаунт — это учётная запись, позволяющая пользователю взаимодействовать с определённой системой, сервисом или приложением в интернете. Аккаунты используются на различных платформах, таких как социальные сети, электронная почта, онлайн-магазины, форумы, игры и многие другие.",
            forms: "мн.ч.: Акауӈы | род.падеж: Акауӈа | дат.падеж: Акауӈу | вин.падеж: Акауӈ | твор.падеж: Акауӈом | пред.падеж: Акауӈѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "Акно", 
            translation: "Окно",
            description: "Окно — это архитектурный элемент, представляющий собой проем в стене, который обычно заполняется стеклом. Окна служат для пропуска естественного света и вентиляции в помещениях, а также обеспечивают вид на улицу или окружающую природу.",
            forms: "мн.ч.: Акна | род.падеж: Акон | дат.падеж: Акну | вин.падеж: Акно | твор.падеж: Акном | пред.падеж: Акњѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "Акромњиj", 
            translation: "Огромный",
            description: "Огромный — это прилагательное, которое используется для описания чего-то очень большого по размеру, объему или количеству. Слово часто используется для акцентирования внимания на впечатляющих масштабах объектов, явлений или количеств.",
            forms: "Какой: Акромњиj | Какая: Акромна | Какое: Акромноѥ̆ | Какие: Акромњиѥ̆"
        },
        { 
            word: "Аљистагар", 
            translation: "Катастрофа",
            description: "Катастрофа — это внезапное событие с тяжёлыми, зачастую разрушительными последствиями: оно может приводить к человеческим жертвам, серьёзному ущербу здоровью людей, масштабным разрушениям объектов, значительному вреду окружающей среде.",
            forms: "мн.ч.: Аљистагары | род.падеж: Аљистагары | дат.падеж: Аљистагарѥ | вин.падеж: Аљистагару | твор.падеж: Аљистагароj | пред.падеж: Аљистагарѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "Ан", 
            translation: "Мягкий",
            description: "«Мягкий» — это прилагательное, которое может означать разное в зависимости от ситуации.",
            forms: "не изменяется"
        },
        { 
            word: "Анvарь", 
            translation: "Январь",
            description: "Январь — первый месяц года в григорианском и юлианском календарях, длится 31 день. В Северном полушарии это разгар зимы, обычно самый холодный месяц, а в Южном — один из самых тёплых, потому что там лето.",
            forms: "мн.ч.: Анvары | род.падеж: Анvарѥj | дат.падеж: Анvарӯ | вин.падеж: Анvарь | твор.падеж: Анvарюм | пред.падеж: Анvарѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "Андитъѥ̆н", 
            translation: "Ответ",
            description: "«Ответ» — это реакция, сообщение или действие, которое дают в связи с каким‑то вопросом, обращением, событием или задачей.",
            forms: "мн.ч.: Андитъѥ̆ны | род.падеж: Андитъѥ̆ныv | дат.падеж: Андитъѥ̆ну | вин.падеж: Андитъѥ̆н | твор.падеж: Андитъѥ̆ном | пред.падеж: Андитъѥ̆њѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "Анка", 
            translation: "Мягкая Игрушка",
            description: "Мягкая игрушка — это игрушка, сделанная из мягких материалов: ткани, искусственного или натурального меха, а внутри она набита чем‑то упругим.",
            forms: "мн.ч.: Анкы | род.падеж: Анкы | дат.падеж: Анкѥ | вин.падеж: Анку | твор.падеж: Анкоj | пред.падеж: Анкѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "Анлон", 
            translation: "Понедельник",
            description: "Понедельник — день недели, который идёт сразу после воскресенья и обычно считается первым рабочим днём новой недели.",
            forms: "мн.ч.: Анлоны | род.падеж: Анлоныv | дат.падеж: Анлону | вин.падеж: Анлон | твор.падеж: Анлоном | пред.падеж: Анлоњѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "Аҥѥл", 
            translation: "Ангел",
            description: "Ангел — это бесплотные духовные существа, посредники между Богом и людьми. Их главная роль — передавать волю Бога, защищать и наставлять людей.",
            forms: "мн.ч.: Аҥѥлы | род.падеж: Аҥѥлыv | дат.падеж: Аҥѥлу | вин.падеж: Аҥѥла | твор.падеж: Аҥѥлом | пред.падеж: Аҥѥљѥ. Другие формы: Отсутсвуют."
        },
        { 
            word: "П", 
            translation: "п",
            description: "п",
            forms: "мн.ч.: п | род.падеж: п | дат.падеж: п | вин.падеж: п | твор.падеж: п | пред.падеж: п. Другие формы: п."
        }
    ];

    let activeLetter = null;

    // Генерация кнопок алфавита
    const alphabetBar = document.getElementById('alphabetBar');
    alphabet.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.textContent = letter;
        btn.onclick = () => filterByLetter(letter, btn);
        alphabetBar.appendChild(btn);
    });

    // Функция отрисовки словаря
    function renderDictionary(data) {
        const list = document.getElementById('dictionaryList');
        const statusBar = document.getElementById('statusBar');
        list.innerHTML = '';

        statusBar.textContent = `Найдено слов: ${data.length}`;

        if (data.length === 0) {
            list.innerHTML = '<div class="no-results">По вашему запросу ничего не найдено</div>';
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            
            const descHtml = item.description ? `<div class="word-description">${item.description}</div>` : '';
            const formsHtml = item.forms ? `<div class="word-forms"><strong>Формы слова:</strong> ${item.forms}</div>` : '';

            card.innerHTML = `
                <div class="word-header">
                    <span class="word-title">${item.word}</span>
                    <span class="word-translation">— ${item.translation}</span>
                </div>
                ${descHtml}
                ${formsHtml}
            `;
            list.appendChild(card);
        });
    }

    // Сквозной поиск
    document.getElementById('searchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        
        if (query) {
            clearActiveButtons();
            activeLetter = null;
        }

        const filtered = dictionary.filter(item => 
            item.word.toLowerCase().includes(query) || 
            item.translation.toLowerCase().includes(query) ||
            (item.description && item.description.toLowerCase().includes(query))
        );
        
        renderDictionary(filtered);
    });

    // Фильтр по первой букве (улучшенный)
    function filterByLetter(letter, buttonElement) {
        document.getElementById('searchInput').value = '';
        clearActiveButtons();

        if (activeLetter === letter) {
            activeLetter = null;
            renderDictionary(dictionary);
        } else {
            activeLetter = letter;
            buttonElement.classList.add('active');
            
            const target = letter.toLowerCase();
            const filtered = dictionary.filter(item => {
                const firstChar = item.word.trim().charAt(0).toLowerCase();
                return firstChar === target;
            });
            
            renderDictionary(filtered);
        }
    }

    function clearActiveButtons() {
        document.querySelectorAll('.letter-btn').forEach(btn => {
            if (!btn.classList.contains('reset-btn')) {
                btn.classList.remove('active');
            }
        });
    }

    function resetFilter() {
        document.getElementById('searchInput').value = '';
        clearActiveButtons();
        activeLetter = null;
        renderDictionary(dictionary);
    }

    // Запуск
    renderDictionary(dictionary);
</script>

</body>
</html>
