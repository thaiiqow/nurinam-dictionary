<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Официальный словарь Нуринамского языка</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #58a6ff;
            --accent-hover: #1f6feb;
            --text-main: #c9d1d9;
            --text-bright: #ffffff;
            --text-muted: #8b949e;
            --border: #30363d;
            --tag-bg: #21262d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: var(--text-bright);
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 1rem;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.05rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text-bright);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .alphabet-section {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .alphabet-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .alphabet-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .letter-btn {
            background: #21262d;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.15s ease;
        }

        .letter-btn:hover {
            background: #30363d;
            color: var(--text-bright);
        }

        .letter-btn.active {
            background-color: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .letter-btn.reset-btn {
            background: #30363d;
            color: var(--text-bright);
            margin-right: 6px;
        }

        .letter-info-card {
            display: none;
            background: linear-gradient(135deg, rgba(31, 111, 235, 0.15), rgba(22, 27, 34, 0.9));
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 16px 20px;
            margin-top: 16px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .letter-info-card.visible {
            display: block;
        }

        .letter-info-header {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .letter-info-body {
            color: var(--text-bright);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-bar {
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .dictionary-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .word-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .word-card:hover {
            border-color: #484f58;
        }

        .word-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            flex-wrap: wrap;
        }

        .word-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent);
        }

        /* Отдельная красивая строка для слова с ударением */
        .word-stress-line {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: -4px;
        }

        .word-stress {
            font-style: italic;
            color: #79c0ff;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .word-translation {
            color: var(--text-bright);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .word-description {
            color: var(--text-main);
            font-size: 0.98rem;
            line-height: 1.5;
        }

        .word-forms {
            background: var(--tag-bg);
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px dotted var(--border);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .word-forms strong {
            color: var(--text-main);
        }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 48px 20px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Официальный словарь Нуринамского языка</h1>
        <p class="subtitle">Полная справочная система, формы слов и алфавитный поиск</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по словам, переводу или описанию...">
    </div>

    <div class="alphabet-section">
        <div class="alphabet-title">Фильтр по первой букве:</div>
        <div class="alphabet-bar" id="alphabetBar">
            <button class="letter-btn reset-btn" onclick="resetFilter()">Все слова</button>
        </div>
        
        <div class="letter-info-card" id="letterInfoCard">
            <div class="letter-info-header" id="letterInfoHeader"></div>
            <div class="letter-info-body" id="letterInfoBody"></div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">
        <span>Показаны все слова</span>
    </div>

    <div class="dictionary-list" id="dictionaryList"></div>
</div>

<script>
    const alphabet = [
        "А", "Ă", "Ꙗ", "Ћ", "V", "Г", "Ґ", "Ѓ", "Д", "Ԭ", 
        "Ѥ", "Ѥ̆", "Ĭ", "Є", "Є̆", "З", "Ҙ", "Ж", "Җ", "Ӝ", 
        "И", "Й", "J", "К", "Ҡ", "Q", "Ќ", "Л", "Љ", "М", 
        "Н", "Ҥ", "Њ", "Ӈ", "О", "Ŏ", "Ю", "П", "Р", "Ṕ", 
        "С", "Б", "Т", "Ҭ", "У", "Ў", "Ӯ", "Ф", "Х", "Ӿ", 
        "Џ", "Џ̆", "Ц", "Ҵ", "Ч", "Ч̆", "Ҷ", "Ꚇ", "Ш", "Ш̆", 
        "Щ", "Щ̆", "Ъ", "Ы", "Ꙑ", "Ы̆", "Ӹ", "Ь", "Ѣ", "Ъ̀",
        "Ԃ", "Һ", "Ԧ", "І"
    ];

    const letterDescriptions = {
        "А": "1-я буква Нуринамского алфавита. Произошла от древнего символа головы быка в протосинайском письме (около 1800–1500 гг. до н. э.). Затем она стала финикийской буквой алеф (𐤀), позже — греческой альфой (Α), а от неё произошли латинская A и кириллическая А. Произносится как русская А.",
        "Ă": "2-я буква Нуринамского алфавита. Была введена при создании нуринамского алфавита для обозначения звука «я». За основу была взята латинская буква A, к которой добавили бреве (˘), чтобы отличить её от обычной A. В нуринамском языке читается как «я» и является самостоятельной буквой алфавита.",
        "Ꙗ": "3-я буква Нуринамского алфавита. Была заимствована из старославянской письменности и используется для обозначения гласного звука «я» без начального [й]. Произносится как звук «я» в слове «мяч», где после согласного отсутствует отдельный звук [й]. Является самостоятельной буквой нуринамского алфавита.",
        "Ћ": "4-я буква Нуринамского алфавита. Используется для обозначения звука «б». Несмотря на свою форму, произносится так же, как русская буква Б. Является самостоятельной буквой нуринамского алфавита.",
        "V": "5-я буква Нуринамского алфавита. Используется для обозначения звука «в». Была заимствована из латинского алфавита и заменяет кириллическую букву В. Является самостоятельной буквой нуринамского алфавита.",
        "Г": "6-я буква Нуринамского алфавита. Используется для обозначения звука «г». Сохранила своё написание и произношение, аналогичные русской букве Г. Является самостоятельной буквой нуринамского алфавита.",
        "Ґ": "7-я буква Нуринамского алфавита. Используется для обозначения твёрдого гортанного звука «г». Произносится глубже и резче, чем обычная Г, и по месту образования близка к звуку «к» в слове «включить», но остаётся отдельным звуком. Является самостоятельной буквой нуринамского алфавита.",
        "Ѓ": "8-я буква Нуринамского алфавита. Используется для обозначения звука «г», аналогичного украинской букве Г — глуховатого гортанного звука, близкого к «х». Является самостоятельной буквой нуринамского алфавита.",
        "Д": "9-я буква Нуринамского алфавита. Используется для обозначения звука «д». Сохранила своё написание и произношение, аналогичные русской букве Д. Является самостоятельной буквой нуринамского алфавита.",
        "Ԭ": "10-я буква Нуринамского алфавита. Используется для обозначения особого согласного звука. Была заимствована из Ландайского и Львовского языков и сохраняет их произношение. При произнесении язык сначала поднимается к нёбу, произносится звук, похожий на «д», после чего язык переходит к верхним зубам, создавая особый переходный звук. Является самостоятельной буквой нуринамского алфавита.",
        "Ѥ": "11-я буква Нуринамского алфавита. Используется для обозначения гласного звука «е» без начального [й]. Произносится как буква Е в слове «меч», где после согласного нет отдельного звука «й». По своему принципу использования похожа на букву Ꙗ, которая также обозначает гласный звук без начального [й]. Является самостоятельной буквой нуринамского алфавита.",
        "Ѥ̆": "12-я буква Нуринамского алфавита. Используется для обозначения сочетания звуков «йе». Произносится как буква Е в начале слова или после гласной, когда присутствует начальный звук [й]. Является самостоятельной буквой нуринамского алфавита.",
        "Ĭ": "13-я буква Нуринамского алфавита. Используется для обозначения мягкого сочетания «ье». Произносится как звук «ь + е», например в слове «вьетнам». В прошлом буква считалась нечистой и имела негативное восприятие из-за особенностей своего происхождения и использования, но в современном нуринамском языке она полностью принята и является обычной буквой алфавита.",
        "Є": "14-я буква Нуринамского алфавита. Используется для обозначения гласного звука «э». Произносится аналогично русской букве Э в словах «это», «этаж». Является самостоятельной буквой нуринамского алфавита.",
        "Є̆": "15-я буква Нуринамского алфавита. Используется для обозначения сочетания звуков «йэ». Произносится как звук «э» с начальным [й], например как «е» в начале слова, но с более открытым произношением. Является самостоятельной буквой нуринамского алфавита.",
        "З": "16-я буква Нуринамского алфавита. Используется для обозначения звонкого согласного звука «з». Сохраняет написание и произношение, аналогичные русской букве З. Является самостоятельной буквой нуринамского алфавита.",
        "Ҙ": "17-я буква Нуринамского алфавита. Используется для обозначения сочетания согласных звуков «дз». Произносится как единый звук, похожий на сочетание д + з в слове «дзвон». Является самостоятельной буквой нуринамского алфавита.",
        "Ж": "18-я буква Нуринамского алфавита. Используется для обозначения звонкого согласного звука «ж». Сохраняет написание и произношение, аналогичные русской букве Ж. Является самостоятельной буквой нуринамского алфавита.",
        "Җ": "19-я буква Нуринамского алфавита. Используется для обозначения мягкого звука «жь». Произносится как звук «ж» с дополнительным смягчением, при котором язык приближается к нёбу. Является самостоятельной буквой нуринамского алфавита.",
        "Ӝ": "20-я буква Нуринамского алфавита. Используется для обозначения звонкого аффрикативного звука «дж». Произносится как слитное сочетание звуков д + ж, например как в английском слове jungle. Является самостоятельной буквой нуринамского алфавита.",
        "И": "21-я буква Нуринамского алфавита. Используется для обозначения гласного звука «и». Сохраняет написание и произношение, аналогичные русской букве И. Является самостоятельной буквой нуринамского алфавита.",
        "Й": "22-я буква Нуринамского алфавита. Используется для обозначения звука «йи». Произносится как сочетание краткого согласного [й] и гласного «и». Является самостоятельной буквой нуринамского алфавита.",
        "J": "23-я буква Нуринамского алфавита. Используется для обозначения согласного звука «й». Произносится как краткий палатальный звук [й], аналогичный русской букве Й в словах «йод» и «йога». Является самостоятельной буквой нуринамского алфавита.",
        "К": "24-я буква Нуринамского алфавита. Используется для обозначения глухого согласного звука «к». Сохраняет написание и произношение, аналогичные русской букве К. Является самостоятельной буквой нуринамского алфавита.",
        "Ҡ": "25-я буква Нуринамского алфавита. Используется для обозначения гортанного звука «к». Произносится глубже и резче, чем обычная К, с образованием звука в задней части ротовой полости, аналогично букве Ґ, но с глухим произношением. Является самостоятельной буквой нуринамского алфавита.",
        "Q": "26-я буква Нуринамского алфавита. Используется в нуринамском языке для обозначения звука «ҡӹ». Она представляет собой сочетание гортанного согласного Ҡ и звука ӹ, образуя самостоятельный звук. Буква Qq является самостоятельной буквой нуринамского алфавита.",
        "Ќ": "27-я буква Нуринамского алфавита. Буква Ќ используется в нуринамском языке для обозначения согласного звука «кх». Она произносится как слитное сочетание звуков к и х. Буква Ќќ является самостоятельной буквой нуринамского алфавита.",
        "Л": "28-я буква Нуринамского алфавита. Буква Л используется в нуринамском языке для обозначения согласного звука «л». Она сохраняет написание и произношение, аналогичные русской букве Л. Буква Лл является самостоятельной буквой нуринамского алфавита.",
        "Љ": "29-я буква Нуринамского алфавита. Буква Љ используется в нуринамском языке для обозначения мягкого согласного звука «ль». Она произносится как смягчённая буква Л, аналогично мягкому звуку в русском слове «лист». Буква Љљ является самостоятельной буквой нуринамского алфавита.",
        "М": "30-я буква Нуринамского алфавита. М — буква нуринамского алфавита, обозначающая звук «м», аналогичный русской букве М.",
        "Н": "31-я буква Нуринамского алфавита. Н — буква нуринамского алфавита, обозначающая звук «н», аналогичный русской букве Н.",
        "Ҥ": "32-я буква Нуринамского алфавита. Ҥ — буква нуринамского алфавита, обозначающая звук «нг». Произносится как единый носовой звук.",
        "Њ": "33-я буква Нуринамского алфавита. Њ — буква нуринамского алфавита, обозначающая мягкий звук «нь», аналогичный мягкому Н в русском языке, по принципу произношения близкий к Љ («ль»).",
        "Ӈ": "34-я буква Нуринамского алфавита. Ӈ — буква нуринамского алфавита, обозначающая звук «нт». Произносится как слитный согласный звук.",
        "О": "35-я буква Нуринамского алфавита. О — буква нуринамского алфавита, обозначающая гласный звук «о», аналогичный русской букве О.",
        "Ŏ": "36-я буква Нуринамского алфавита. Ŏ — буква нуринамского алфавита, обозначающая звук «йо». Произносится как сочетание [й] + о.",
        "Ю": "37-я буква Нуринамского алфавита. Ю — буква нуринамского алфавита, обозначающая звук «ё» без начального [й], как Е в слове «мёд». (По типу Ꙗ и Ѥ)",
        "П": "38-я буква Нуринамского алфавита. П — буква нуринамского алфавита, обозначающая глухой согласный звук «п», аналогичный русской букве П.",
        "Р": "39-я буква Нуринамского алфавита. Р — буква нуринамского алфавита, обозначающая согласный звук «р», аналогичный русской букве Р.",
        "Ṕ": "40-я буква Нуринамского алфавита. Ṕ — буква нуринамского алфавита, обозначающая особый звук «р». По принципу образования он аналогичен звуку буквы Ԭ, но вместо «д» используется «р». Буква Ṕṕ является самостоятельной буквой нуринамского алфавита.",
        "С": "41-я буква Нуринамского алфавита. С — буква нуринамского алфавита, обозначающая звук «с». Буква Сс является самостоятельной буквой нуринамского алфавита.",

    let activeLetter = null;

    function renderAlphabet() {
        const bar = document.getElementById("alphabetBar");
        alphabet.forEach(letter => {
            const btn = document.createElement("button");
            btn.className = "letter-btn";
            btn.innerText = letter;
            btn.onclick = () => filterByLetter(letter, btn);
            bar.appendChild(btn);
        });
    }

    function renderDictionary(data) {
        const list = document.getElementById("dictionaryList");
        list.innerHTML = "";

        if (data.length === 0) {
            list.innerHTML = `<div class="no-results">Слова не найдены</div>`;
            return;
        }

        data.forEach(item => {
            const card = document.createElement("div");
            card.className = "word-card";

            // Отображаем строку с ударением, если она заполнена
            const stressHtml = item.stress ? `<div class="word-stress-line">Ударение: <span class="word-stress">${item.stress}</span></div>` : '';

            card.innerHTML = `
                <div class="word-header">
                    <span class="word-title">${item.word}</span>
                    <span class="word-translation">— ${item.translation}</span>
                </div>
                ${stressHtml}
                <div class="word-description">${item.description}</div>
                <div class="word-forms"><strong>Формы:</strong> ${item.forms}</div>
            `;
            list.appendChild(card);
        });
    }

    function filterByLetter(letter, btnElement) {
        activeLetter = letter;

        document.querySelectorAll(".letter-btn").forEach(b => b.classList.remove("active"));
        if (btnElement) {
            btnElement.classList.add("active");
        }

        const infoCard = document.getElementById("letterInfoCard");
        const infoHeader = document.getElementById("letterInfoHeader");
        const infoBody = document.getElementById("letterInfoBody");

        if (letterDescriptions[letter]) {
            infoHeader.innerText = `Буква «${letter}»`;
            infoBody.innerText = letterDescriptions[letter];
            infoCard.classList.add("visible");
        } else {
            infoCard.classList.remove("visible");
        }

        applyFilters();
    }

    function resetFilter() {
        activeLetter = null;
        document.querySelectorAll(".letter-btn").forEach(b => b.classList.remove("active"));
        document.getElementById("letterInfoCard").classList.remove("visible");
        applyFilters();
    }

    function applyFilters() {
        const query = document.getElementById("searchInput").value.toLowerCase().trim();

        let filtered = dictionary.filter(item => {
            const matchesSearch = item.word.toLowerCase().includes(query) ||
                                  item.translation.toLowerCase().includes(query) ||
                                  item.description.toLowerCase().includes(query) ||
                                  (item.stress && item.stress.toLowerCase().includes(query));

            const matchesLetter = activeLetter ? item.word.startsWith(activeLetter) : true;

            return matchesSearch && matchesLetter;
        });

        renderDictionary(filtered);
        updateStatus(filtered.length);
    }

    function updateStatus(count) {
        const status = document.getElementById("statusBar");
        if (activeLetter) {
            status.innerText = `Буква «${activeLetter}»: найдено слов — ${count}`;
        } else if (document.getElementById("searchInput").value.trim() !== "") {
            status.innerText = `Результаты поиска: найдено слов — ${count}`;
        } else {
            status.innerText = `Показаны все слова (${count})`;
        }
    }

    document.getElementById("searchInput").addEventListener("input", applyFilters);

    // Инициализация при загрузке
    renderAlphabet();
    renderDictionary(dictionary);
</script>
